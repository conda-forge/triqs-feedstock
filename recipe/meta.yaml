{% set version = "4.0.1" %}

{% set mpi_prefix = "mpi_" + mpi %}

package:
  name: triqs
  version: {{ version }}

source:
  url: https://github.com/TRIQS/triqs/releases/download/{{ version }}/triqs-{{ version }}.tar.gz
  sha256: e27ea2c09e6eb22a580b85e3d6f6c3f93c985e9c633646f1a265ef81612c2b9e

build:
  number: 0
  skip: true  # [win or py<30]
  # triqs only uses Boost::headers (header-only); libboost-devel is needed in
  # host so find_package(Boost) resolves via BoostConfig.cmake under CMP0167,
  # but its run_exports pin on the compiled libboost lib is not actually needed.
  ignore_run_exports:
    - libboost

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - scipy                                  # [build_platform != target_platform]
    - make
    - cmake
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - {{ mpi }}                              # [mpi == 'openmpi' and build_platform != target_platform]
    - clangxx  # [osx]
  host:
    - libboost-devel
    - fftw
    - fftw * {{ mpi_prefix }}_*
    - gmp
    - hdf5
    - hdf5 * {{ mpi_prefix }}_*
    - mako
    - importlib-metadata  # [py<38]
    - mpi4py
    - numpy
    - {{ mpi }}
    - python
    - scipy
    - libblas
    - liblapack
    - libclang
    - zlib
  run:
    - fftw
    - fftw * {{ mpi_prefix }}_*
    - gmp
    - hdf5
    - hdf5 * {{ mpi_prefix }}_*
    - mako
    - importlib-metadata  # [py<38]
    - mpi4py
    - {{ mpi }}
    - python
    - scipy
    - matplotlib-base
    - libclang
    - zlib

test:
  imports:
    - triqs

about:
  home: https://triqs.github.io
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE.txt
  summary: Toolbox for Research on Interacting Quantum Systems

extra:
  recipe-maintainers:
    - wentzell
    - pgunn
    - thoemi09
